<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COUNT365 – Achieve goals with daily efforts</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora"><i></i><i></i></div><div class="grain"></div><div class="spot" id="spot"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div><h1>COUNT365</h1><p>Achieve goals with daily efforts</p></div></div>
    <div class="mon"><button id="pv" aria-label="Previous month">‹</button><div class="mn"><div id="mname"></div><div id="myear"></div></div><button id="nx" aria-label="Next month">›</button></div>
    <div class="seg" id="seg" data-m="month"><i></i><button data-m="month" class="on">Month</button><button data-m="year">Whole year</button></div>
    <button class="repbtn" id="repbtn" type="button">↻ Repeating tasks</button>
    <div>
      <div class="st"><span id="l1">Day of 365</span><b id="s1">0</b></div>
      <div class="st"><span>Day ends in</span><b id="s2">–</b></div>
      <div class="st"><span>Perfect days</span><b id="s3">0</b></div>
      <div class="st"><span>Tasks done</span><b id="s4">0</b></div>
    </div>
    <div class="yr"><div id="yb"></div></div>
    <div class="chips" id="chips"></div>
    <div class="acct"><span id="who"></span><button id="logout" type="button">Log out</button></div>
  </aside>
  <main class="main" id="main">
    <div class="ghost" id="ghost"></div>
    <div class="stage" id="stage"><div id="grid" role="grid" aria-label="Days"></div></div>
  </main>
</div>
<div class="tip" id="tip"></div>
<div class="veil" id="veil" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="tb"><i id="tb"></i></div>
    <div class="mark" id="mark"></div>
    <div class="pg" id="pg">
      <div class="nav"><button class="x" id="close" aria-label="Close">×</button><div><button id="dp" aria-label="Previous day">‹</button><button id="dn" aria-label="Next day">›</button></div></div>
      <div class="hd"><div><div class="wk" id="wk"></div><div class="dt" id="dt"></div></div><div class="ring"><svg viewBox="0 0 72 72"><circle class="t" cx="36" cy="36" r="34"/><circle class="p" id="rp" cx="36" cy="36" r="34"/></svg><span id="rt">0%</span></div></div>
      
      <form id="f"><input id="in" maxlength="120" placeholder="Add a task" autocomplete="off" aria-label="New task"><button class="add" type="submit" aria-label="Add task">Add</button></form>
      <button class="carry" id="carry" type="button" hidden></button>
      <div class="cnt" id="cnt"></div><ul id="list"></ul>
    </div>
  </div>
</div>
<div class="rep off" id="rep">
  <div class="rep-card" role="dialog" aria-modal="true" aria-labelledby="rh">
    <button class="rep-x" id="rclose" type="button" aria-label="Close">×</button>
    <h2 id="rh">Repeating tasks</h2>
    <form class="aform" id="rf" novalidate>
      <label class="rlab" for="rtext">Task</label>
      <input id="rtext" maxlength="120" placeholder="e.g. Read for 30 minutes" autocomplete="off">
      <div class="rrow">
        <div><label class="rlab" for="rfrom">From</label><input id="rfrom" type="date"></div>
        <div><label class="rlab" for="rto">To</label><input id="rto" type="date"></div>
      </div>
      <span class="rlab">Repeat on</span>
      <div class="days" id="rdays"></div>
      <div class="pre" id="rpre"><button type="button" data-p="all">Every day</button><button type="button" data-p="monsat">Mon–Sat</button><button type="button" data-p="monfri">Mon–Fri</button></div>
      <button class="add" id="rgo" type="submit">Add to timeline</button>
      <div class="amsg" id="rmsg" role="status"></div>
    </form>
    <div class="rlh" id="rlh" hidden>Your repeating tasks</div>
    <div id="rlist"></div>
  </div>
</div>
<div class="auth" id="auth">
  <div class="auth-card">
    <h2>COUNT365</h2>
    <p>Achieve goals with daily efforts</p>
    <div class="seg" id="aseg" data-m="login"><i></i><button type="button" data-m="login" class="on">Log in</button><button type="button" data-m="signup">Sign up</button></div>
    <form class="aform" id="af" novalidate>
      <input id="ae" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
      <input id="ap" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button class="add" id="asub" type="submit">Log in</button>
      <div class="amsg" id="amsg" role="status"></div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="script.js"></script>
<script src="routines.js"></script>
<script src="auth.js"></script>
</body>
</html>
